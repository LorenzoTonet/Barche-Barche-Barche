mode: "human"
# mode: "agent"
# mode: "random"


# init
max_speed: 10.0
sail_rotation_speed: 0.1
boat_rotation_speed: 0.05
initial_boat_angle: 0.0
initial_position:
  - 5.0
  - 5.0


# wind vector field
#   if I want a uniform change over the env, space_scale = 0.0. If I want a static wind, speed_variance = 0.0 and max_angle_shift = 0.0.
initial_wind:
  - 1.0
  - 1.0
space_scale: 0.005     # suggested value: 0.005
time_scale: 0.02       # suggested value: 0.02
speed_variance: 0.2    # suggested value: 0.2
max_angle_shift: 45    # suggested value: 45 in degrees!

# Map configuration
map_width: 100
map_height: 100
water_friction: 3.0
border_tolerance: 0.0


# Simulation configuration
dt: 0.1
max_steps: 1000


# Rendering configuration
window_width: 600
window_height: 600
render_fps: 30


polar_diagram_vals:
  - [0, 0]
  - [52, 5.58]
  - [60, 5.89]
  - [75, 6.11]
  - [90, 6.15]
  - [110, 6.24]
  - [120, 6.11]
  - [135, 5.46]
  - [150, 4.60]
  - [180, 4.0]


plot: False


PPO:
  state_dim: 13
  action_dim: 1
  hidden_dim: 128
  clip_ratio: 0.2
  epochs: 5
  shared_net: False

train:
  n_episodes: 1000
  update_timestep: 4000

  # roba che prima era in PPOAgent e che vogliamo mettere in train
  discount_factor: 0.99
  lr: 0.01
  critic_loss_parameter: 0.5
  entropy_loss_parameter: 0.01

  reset_every: 10 # Every n episodes re-generate the environment

  env:
    map_width: 100
    map_height: 100
    n_checkpoints: 3


evaluate:
  n_episodes: 100
